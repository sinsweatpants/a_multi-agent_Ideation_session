<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>النسخة :: the copy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">تطوير القصة متعدد الوكلاء</h1>
            <p class="text-lg text-gray-600 mt-2">نظام ذكي لتحليل وتطوير الأفكار الإبداعية</p>
        </header>

        <main id="app" class="bg-white p-6 rounded-lg shadow-lg">
            <!-- Dramatic Treatment Section -->
            <section id="treatment-section">
                <h2 class="text-2xl font-semibold mb-4">أدخل المعالجة الدرامية</h2>
                <p class="text-gray-600 mb-4">قدم ملخصًا مفصلاً أو معالجة درامية لقصتك. كلما كانت التفاصيل أكثر، كان تحليل السياق أعمق.</p>
                <textarea id="treatment-input" rows="8" placeholder="على سبيل المثال: 'تدور أحداث القصة في عام 2099، حيث يعيش محقق خاص منعزل في مدينة غارقة في الأمطار النيونية. يتم تكليفه بالعثور على ابنة الرئيس التنفيذي لشركة تكنولوجيا عملاقة، ليكتشف مؤامرة تهدد بتعتيم الخط الفاصل بين الوعي البشري والذكاء الاصطناعي...'" class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                <button id="generate-report-btn" class="mt-4 w-full bg-green-600 text-white font-bold py-3 px-8 rounded-md hover:bg-green-700">تحليل السياق</button>
            </section>

            <!-- Results Section -->
            <section id="results-section" class="hidden">
                <div id="status-indicator" class="text-center p-4 hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                    <p id="status-text" class="mt-4 text-lg font-semibold">جارٍ العمل...</p>
                </div>
                <!-- The results content will be dynamically generated by script.js -->
                <div id="results-content" class="hidden space-y-8"></div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
