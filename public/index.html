<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطوير القصة متعدد الوكلاء</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900" style="font-family: 'Cairo', sans-serif;">النسخة :: the copy</h1>
            <p class="text-xl text-gray-600 mt-2" style="font-family: 'Cairo', sans-serif;">بنات افكارك</p>
        </header>

        <main id="app" class="bg-white p-6 rounded-lg shadow-lg">
            <!-- Creative Brief Section -->
            <section id="creative-brief-section">
                <h2 class="text-2xl font-semibold mb-4">بلغني ايها الملك السعيد</h2>
                <textarea id="creative-brief-input" rows="4" placeholder="" class="w-full p-3 border rounded-md focus:ring-2 focus:ring-blue-500"></textarea>
                <button id="generate-ideas-btn" class="mt-4 w-full bg-green-600 text-white font-bold py-3 px-8 rounded-md hover:bg-green-700">توليد الأفكار</button>
            </section>

            <!-- Results Section -->
            <section id="results-section" class="hidden">
                <div id="status-indicator" class="text-center p-4 hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto"></div>
                    <p id="status-text" class="mt-4 text-lg font-semibold">جارٍ العمل...</p>
                </div>
                <div id="results-content" class="hidden space-y-8">
                    <section id="divergence-section"></section>
                    <section id="selection-section" class="mt-6"></section>
                    <section id="hybrid-section"></section>
                    <section id="reviews-section"></section>
                    <section id="debate-section"></section>
                    <section id="audience-section"></section>
                    <section id="decision-section"></section>
                    <section id="salvage-section"></section>
                    <section id="stress-section"></section>
                    <section id="final-report-section"></section>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
